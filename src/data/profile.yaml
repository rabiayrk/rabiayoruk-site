research:
  - title: "Reliable LLM systems"
    text: "When does an LLM classifier stay correct after the data changes? I measure drift, hallucination and failure modes in systems that run every day."
  - title: "Cost and safety of ML in production"
    text: "Accuracy is one number. Cost per record, latency and the price of a wrong decision are others. I look for designs that keep all of them in check."
  - title: "Web data at scale"
    text: "Agents and crawlers that collect public web data, and ways to evaluate them honestly: coverage, freshness and error rates."

inPreparation:
  - "Cost, accuracy and drift in LLM-based classification of web records."
  - "An evaluation framework for agent-based web data collection."
  - "Detecting hallucinations in production RAG decisions."

